name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and Upload (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p openalex-snapshot

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="openalex-snapshot${{ matrix.bin_ext }}"
          PKG="openalex-snapshot-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$PKG"
          cp "target/${{ matrix.target }}/release/$BIN" "$PKG/"
          cp README.md "$PKG/"
          tar -czf "$PKG.tar.gz" "$PKG"
          echo "ASSET=$PKG.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "openalex-snapshot${{ matrix.bin_ext }}"
          $pkg = "openalex-snapshot-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$bin" "$pkg/"
          Copy-Item "README.md" "$pkg/"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip" -Force
          "ASSET=$pkg.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
