[workspace]
resolver = "2"
members = [
    "openalex-core",
    "openalex-snapshot",
]

# Shared dependency versions — both crates pick them up via `workspace = true`.
[workspace.dependencies]
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
