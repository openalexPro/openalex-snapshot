[package]
name = "openalex-snapshot"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "openalex-snapshot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
indicatif = "0.17"
flate2 = "1"
rand = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3"
